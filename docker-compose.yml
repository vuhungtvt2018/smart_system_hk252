version: '3.8'

services:
  db:
    image: postgres:15
    container_name: retainai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retainai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retainai_password}
      POSTGRES_DB: ${POSTGRES_DB:-retainai_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: retainai_api
    restart: always
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-retainai_user}:${POSTGRES_PASSWORD:-retainai_password}@db:5432/${POSTGRES_DB:-retainai_db}
      - ENVIRONMENT=development
      - AIRFLOW_URL=${AIRFLOW_URL:-http://airflow:8080/api/v1/dags/retrain_pipeline/dagRuns}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api:/app/api
      - ./models:/app/models
      - ./data:/app/data
      - ${MLRUNS_PATH:-./mlruns}:/mlruns
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    container_name: retainai_mlflow
    restart: always
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://${POSTGRES_USER:-retainai_user}:${POSTGRES_PASSWORD:-retainai_password}@db:5432/${POSTGRES_DB:-retainai_db}
      - MLFLOW_ARTIFACT_ROOT=${MLFLOW_ARTIFACT_ROOT:-/mlruns}
    volumes:
      - ${MLRUNS_PATH:-./mlruns}:/mlruns
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.fre
      target: development
    container_name: retainai_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

  airflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: retainai_airflow
    restart: always
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - AIRFLOW_WWW_USER_USERNAME=admin
      - AIRFLOW_WWW_USER_PASSWORD=admin
      - DATABASE_URL=postgresql://${POSTGRES_USER:-retainai_user}:${POSTGRES_PASSWORD:-retainai_password}@db:5432/${POSTGRES_DB:-retainai_db}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/app/data
      - ./models:/app/models
      - ./api:/app/api
      - ${MLRUNS_PATH:-./mlruns}:/mlruns
    command: >
      bash -c "
      rm -f /opt/airflow/airflow-webserver.pid &&
      airflow db init &&
      airflow users create --username admin --firstname Admin --lastname Admin --role Admin --email admin@example.com --password admin || true &&
      airflow webserver &
      sleep 10 &&
      airflow scheduler
      "

volumes:
  postgres_data:
